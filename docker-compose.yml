version: '3.8'

services:
  # 1. Grand Gallery (Message Broker)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: grand-gallery
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --memory
      - 512M
      - --overprovisioned
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:9094
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:9094
    ports:
      - "9092:9092"
      - "9094:9094"

  # 2. PostgreSQL Data Store
  postgres:
    image: postgres:15-alpine
    container_name: kings-chamber-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: execution_engine
    ports:
      - "5432:5432"

  # 3. Singularity Gateway (Go Ingestion)
  gateway:
    image: golang:1.21-alpine
    container_name: singularity-gateway
    volumes:
      - ./main.go:/app/main.go
    working_dir: /app
    # Generates go.mod and installs kafka-go on the fly
    command: >
      sh -c "go mod init gateway && 
             go get github.com/segmentio/kafka-go@v0.4.47 && 
             go run main.go"
    ports:
      - "8080:8080"
    depends_on:
      - redpanda

  # 4. Quantum EV Logic Engine (Python ML Worker)
  engine:
    image: python:3.11-slim
    container_name: quantum-ev-engine
    volumes:
      - ./engine.py:/app/engine.py
    working_dir: /app
    environment:
      KAFKA_BROKER: redpanda:9092
      POSTGRES_HOST: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: execution_engine
    # Installs requirements on the fly before running the engine
    command: >
      sh -c "pip install --no-cache-dir kafka-python==2.0.2 psycopg2-binary==2.9.9 prometheus-client==0.20.0 && 
             python -u engine.py"
    ports:
      - "8000:8000"
    depends_on:
      - redpanda
      - postgres

  # 5. Prometheus Metrics Scraper
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - engine

  # 6. Grafana Visualization Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
